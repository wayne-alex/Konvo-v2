<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Chat Dashboard</title>
    <link rel="icon" href="img/mdb-favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.2/css/all.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
    />
    <link rel="stylesheet" href="css/bootstrap-chat.min.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
      }
      #chat3 .form-control {
        border-color: transparent;
      }
      #chat3 .form-control:focus {
        border-color: transparent;
        box-shadow: inset 0px 0px 0px 1px transparent;
      }
      .badge-dot {
        border-radius: 50%;
        height: 10px;
        width: 10px;
        margin-left: 2.9rem;
        margin-top: -0.75rem;
      }
      .app-container {
        height: 100vh;
        padding: 0;
        margin: 0;
        max-width: 100%;
      }
      .card {
        height: 100vh;
        margin: 0;
        border-radius: 0 !important;
        background: #ffffff;
      }
      .card-body {
        height: 100%;
        padding: 0;
      }
      .chat-container {
        height: calc(100vh - 130px);
      }
      /* Modern header styles */
      .chat-header {
        background-color: #ffffff;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .chat-logo {
        width: 40px;
        height: 40px;
        margin-right: 15px;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
      }
      .chat-logo i {
        color: white;
        font-size: 20px;
      }
      .chat-title {
        font-size: 1.4rem;
        font-weight: 600;
        margin: 0;
        color: #2b2d42;
        letter-spacing: -0.5px;
      }
      .chat-actions {
        margin-left: auto;
        display: flex;
        gap: 20px;
      }
      .chat-actions i {
        font-size: 20px;
        cursor: pointer;
        color: #2b2d42;
        opacity: 0.8;
        transition: all 0.2s ease;
      }
      .chat-actions i:hover {
        opacity: 1;
        transform: scale(1.05);
      }
      /* Modern search bar */
      .search-container {
        padding: 16px 20px;
        background-color: #ffffff;
      }
      .input-group {
        background-color: #f8f9fa;
        border-radius: 12px;
        overflow: hidden;
      }
      .input-group input {
        border: none;
        padding: 12px 20px;
        background-color: transparent;
        font-size: 0.95rem;
      }
      .input-group-text {
        background-color: transparent;
        border: none;
        color: #2b2d42;
        opacity: 0.7;
      }
      /* Modern chat list */
      .chat-list {
        padding: 0 10px;
      }
      .list-unstyled li {
        padding: 12px;
        border-radius: 12px;
        transition: all 0.2s ease;
        margin-bottom: 4px;
      }
      .list-unstyled li:hover {
        background-color: #f8f9fa;
      }
      .list-unstyled img {
        border-radius: 15px;
        width: 50px;
        height: 50px;
        object-fit: cover;
      }
      .fw-bold {
        color: #2b2d42;
        font-size: 1rem;
      }
      .small {
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="app-container container-fluid">
      <div class="row h-100">
        <div class="col-12 p-0">
          <div class="card" id="chat3">
            <div class="card-body">
              <div class="chat-header">
                <div class="chat-logo">
                  <i class="fas fa-comments"></i>
                </div>
                <h1 class="chat-title">Messages</h1>
                <div class="chat-actions">
                  <i class="fas fa-search"></i>
                  <i class="fas fa-bell"></i>
                  <i class="fas fa-ellipsis-v"></i>
                </div>
              </div>

              <div class="search-container">
                <div class="input-group rounded">
                  <input
                    type="search"
                    class="form-control"
                    placeholder="Search messages"
                    aria-label="Search"
                    aria-describedby="search-addon"
                  />
                  <span class="input-group-text" id="search-addon">
                    <i class="fas fa-search"></i>
                  </span>
                </div>
              </div>

              <div class="chat-container overflow-auto">
                <div class="chat-list">
                  <ul class="list-unstyled mb-0">
                    <li>
                      <a
                        href="chat.html"
                        class="d-flex justify-content-between text-decoration-none"
                      >
                        <div class="d-flex flex-row">
                          <div class="position-relative">
                            <img
                              src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-chat/ava1-bg.webp"
                              alt="avatar"
                              class="d-flex align-self-center me-3"
                            />
                            <span
                              class="badge bg-success badge-dot position-absolute"
                            ></span>
                          </div>
                          <div class="pt-1">
                            <p class="fw-bold mb-0">Marie Horwitz</p>
                            <p class="small text-muted">
                              Hello, Are you there?
                            </p>
                          </div>
                        </div>
                        <div class="pt-1">
                          <p class="small text-muted mb-1">Just now</p>
                          <span class="badge bg-danger rounded-pill float-end"
                            >3</span
                          >
                        </div>
                      </a>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="text/javascript" src="js/mdb.min.js"></script>
  </body>
</html>
