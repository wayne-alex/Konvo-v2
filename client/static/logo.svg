<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="#25D366"/>
  
  <!-- K Letter with circular framing -->
  <g transform="translate(60,60)">
    <!-- Subtle circular highlight -->
    <circle r="42" fill="#2FE375" opacity="0.3"/>
    
    <!-- K Letter -->
    <g transform="scale(1.2)">
      <!-- Vertical line -->
      <path d="M-15,-25 L-15,25" 
            stroke="white" 
            stroke-width="12" 
            stroke-linecap="round"/>
      
      <!-- Diagonal lines -->
      <path d="M-15,0 L15,-25" 
            stroke="white" 
            stroke-width="12" 
            stroke-linecap="round"/>
            
      <path d="M-15,0 L15,25" 
            stroke="white" 
            stroke-width="12" 
            stroke-linecap="round"/>
    </g>

    <!-- Subtle accent dots -->
    <circle cx="30" cy="-30" r="4" fill="white" opacity="0.5"/>
    <circle cx="-30" cy="30" r="4" fill="white" opacity="0.5"/>
  </g>
</svg>
