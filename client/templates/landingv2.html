{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/svg+xml" href="{% static 'logo.svg' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#667eea">
    <title>Welcome to Messages</title>
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --bg-color: #ffffff;
            --text-color: #2b2d42;
            --text-secondary: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 48px 24px;
        }

        .icon-circle {
            width: 280px;
            height: 280px;
            position: relative;
            margin: 20px 0;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-text {
            text-align: center;
            margin: 32px 0;
            animation: fadeIn 1.5s ease-out 0.3s backwards;
        }

        .welcome-text h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .welcome-text p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        .links {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .links:hover {
            opacity: 0.8;
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary-color);
            margin: 24px 0;
            padding: 8px 16px;
            border-radius: 12px;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s;
            animation: fadeIn 1.5s ease-out 0.6s backwards;
        }

        .language-selector:hover {
            background-color: #edf2f7;
        }

        .btn-continue {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            margin-top: auto;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeIn 1.5s ease-out 0.9s backwards;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        svg {
            stroke: var(--primary-color);
            fill: none;
            stroke-width: 1.5;
        }
    </style>
</head>
<body>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions for gradients and filters -->
    <defs>
        <!-- Main gradient -->
        <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea">
                <animate attributeName="stop-color"
                         values="#667eea;#764ba2;#667eea"
                         dur="4s" repeatCount="indefinite"/>
            </stop>
            <stop offset="100%" style="stop-color:#764ba2">
                <animate attributeName="stop-color"
                         values="#764ba2;#667eea;#764ba2"
                         dur="4s" repeatCount="indefinite"/>
            </stop>
        </linearGradient>

        <!-- Glow filter -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Particle effect -->
        <radialGradient id="particleGradient">
            <stop offset="0%" stop-color="#667eea"/>
            <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Background pulse circle -->
    <circle cx="200" cy="200" r="190" fill="none" stroke="url(#mainGradient)" stroke-width="2" opacity="0.1">
        <animate attributeName="r" values="185;190;185" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbital rings -->
    <g transform="translate(200,200)">
        <circle r="150" fill="none" stroke="url(#mainGradient)" stroke-width="1" opacity="0.3">
            <animateTransform attributeName="transform" type="rotate"
                              from="0" to="360" dur="20s" repeatCount="indefinite"/>
        </circle>
        <circle r="120" fill="none" stroke="url(#mainGradient)" stroke-width="1" opacity="0.3">
            <animateTransform attributeName="transform" type="rotate"
                              from="360" to="0" dur="15s" repeatCount="indefinite"/>
        </circle>
        <circle r="90" fill="none" stroke="url(#mainGradient)" stroke-width="1" opacity="0.3">
            <animateTransform attributeName="transform" type="rotate"
                              from="0" to="360" dur="10s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Main K with animation -->
    <g transform="translate(200,200)" filter="url(#glow)">
        <path d="M-20,-40 L-20,40" stroke="url(#mainGradient)" stroke-width="8" stroke-linecap="round">
            <animate attributeName="stroke-width" values="8;10;8" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M-20,0 L20,-40" stroke="url(#mainGradient)" stroke-width="8" stroke-linecap="round">
            <animate attributeName="stroke-width" values="8;10;8" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M-20,0 L20,40" stroke="url(#mainGradient)" stroke-width="8" stroke-linecap="round">
            <animate attributeName="stroke-width" values="8;10;8" dur="2s" repeatCount="indefinite"/>
        </path>
    </g>

    <!-- Floating particles -->
    <g>
        <circle cx="200" cy="160" r="2" fill="url(#mainGradient)">
            <animate attributeName="cy" values="160;140;160" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="240" cy="200" r="2" fill="url(#mainGradient)">
            <animate attributeName="cx" values="240;260;240" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="160" cy="200" r="2" fill="url(#mainGradient)">
            <animate attributeName="cx" values="160;140;160" dur="3.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0.5;1" dur="3.5s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Connection lines -->
    <g stroke="url(#mainGradient)" stroke-width="1" opacity="0.3">
        <path d="M200,160 L240,200">
            <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M200,160 L160,200">
            <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
        </path>
    </g>

    <!-- Pulsing dots at intersections -->
    <g fill="url(#mainGradient)">
        <circle cx="200" cy="160" r="3">
            <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="240" cy="200" r="3">
            <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="160" cy="200" r="3">
            <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Outer decorative elements -->
    <g transform="translate(200,200)">
        <!-- Sparkles -->
        <g opacity="0.5">
            <path d="M-140,-140 l5,5 l-5,5 l-5,-5 z" fill="url(#mainGradient)">
                <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
            </path>
            <path d="M140,140 l5,5 l-5,5 l-5,-5 z" fill="url(#mainGradient)">
                <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
            </path>
        </g>
    </g>
</svg>
<div class="welcome-text">
    <h1>Welcome to Konvo</h1>
    <p>Read our <a href="#" class="links">Privacy Policy</a>. Tap "Agree and continue" to accept the <a href="#"
                                                                                                        class="links">Terms
        of Service</a>.</p>
</div>

<div class="language-selector">
    <svg width="20" height="20" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="url(#gradient)"/>
        <path d="M2 12h20" stroke="url(#gradient)"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
              stroke="url(#gradient)"/>
    </svg>
    <span>English</span>
</div>

<button class="btn-continue">Agree and continue</button>

<script>
    document.querySelector('.btn-continue').addEventListener('click', () => {
        window.location.href = '{% url 'register-v2' %}';
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(registration => {
                    console.log('ServiceWorker registration successful');
                })
                .catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
        });
    }
</script>
</body>
</html>
