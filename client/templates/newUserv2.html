<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>New Conversation | Konvo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back_ios"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            font-size: 13px;
        }

        .app-container {
            margin-top: 20px;
        }

        .card {
            border-radius: 10px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: left;
        }

        .section {
            margin-top: 20px;
        }

        .section h5 {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .section ul {
            list-style: none;
            padding-left: 0;
        }

        .section li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .section li .btn-outline-primary {
            font-size: 0.875rem;
            border-radius: 50px;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-container input {
            border-radius: 25px;
        }

        .create-group-btn {
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            display: flex;
            align-items: center;
        }

        .create-group-btn i {
            margin-right: 8px;
        }

        .section img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }

        /* New styles for user info */
        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .user-about {
            font-size: 12px;
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="app-container container-fluid">
    <div class="row h-100">
        <div class="col-12 p-0">
            <div class="card">
                <div class="card-body">
                    <!-- Back Button and New Conversation Title -->
                    <div class="d-flex align-items-center">
                        <a href="{% url 'dashboard-v2' %}" class="btn btn-link">
                            <span class="material-symbols-outlined">
arrow_back_ios
</span>
                        </a>
                        <h3 class="chat-title">New Conversation</h3>
                    </div>

                    <!-- Search Box -->
                    <div class="search-container">
                        <div class="input-group rounded">
                            <input
                                    type="search"
                                    class="form-control"
                                    placeholder="Search users"
                                    aria-label="Search"
                                    aria-describedby="search-addon"
                            />
                            <span class="input-group-text" id="search-addon">
                                <i class="fas fa-search"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Create Group Section -->
                    <div class="d-flex align-items-center mt-4">
                        <button class="create-group-btn" onclick="window.location.href = '{% url 'newGroup-v2' %}';">
                            <i class="fas fa-users"></i> New Group
                        </button>
                    </div>


                    <!-- Divider -->
                    <div class="my-4">
                        <hr>
                    </div>

                    <!-- Grouped Profiles -->
                    <style>
                        /* Add these styles to your existing CSS */
                        .clickable-item {
                            cursor: pointer;
                            transition: background-color 0.2s;
                            text-decoration: none;
                            color: inherit;
                        }

                        .clickable-item:hover {
                            background-color: #f8f9fa;
                            text-decoration: none;
                            color: inherit;
                        }

                        /* Prevent the Add button from triggering the link click */
                        .btn-wrapper {
                            z-index: 2;
                        }
                    </style>

                    {% for letter, profiles in grouped_profiles.items %}
                        <div class="section mt-3">
                            <h5>{{ letter }}</h5>
                            <ul class="list-unstyled">
                                {% for profile in profiles %}
                                    <li>
                                        <a href="{% url 'openChat-v2' profile.user.id %}"
                                           class="clickable-item d-flex justify-content-between align-items-center p-2 rounded">
                                            <div class="d-flex align-items-center">
                                                <img
                                                        src="{{ profile.profile_picture }}"
                                                        alt="{{ profile.user.first_name }}"
                                                        class="me-3"
                                                />
                                                <div class="user-info">
                                                    <span class="user-name">{{ profile.user.first_name }} {{ profile.user.last_name }}</span>
                                                    <p class="user-about">{{ profile.about|default:"Hey there! I'm using Konvo" }}</p>
                                                </div>
                                            </div>
                                            <div class="btn-wrapper">
                                                <button
                                                        class="btn btn-outline-primary btn-sm"
                                                        onclick="handleAdd(this, '{{ profile.user.id }}')"
                                                >
                                                    <i class="fas fa-spinner spinner"></i>
                                                    <span class="btn-text">Add</span>
                                                </button>
                                            </div>
                                        </a>
                                    </li>
                                {% endfor %}
                            </ul>
                        </div>
                    {% endfor %}

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
